[project]
name = "finingest"
version = "0.1.0"
description = "Multi-source financial data ingestion platform"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "pyyaml>=6.0",
  "pyarrow>=14.0",
  "duckdb>=1.1.0",
  "dbt-core>=1.8.0,<2",
  "dbt-duckdb>=1.8.0,<2",
  "boto3>=1.34.0",
  "kafka-python>=2.0.2",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
spark = ["pyspark==3.5.3"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
